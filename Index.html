<script>
const CH=[
{n:1,t:"Physical measurements",ic:"📏",tip:"units, prefixes and dimensional formulas",f:"[F]=MLT⁻² · [W]=ML²T⁻² · [p]=MLT⁻¹ · [ρ]=ML⁻³ · km/h→m/s: ×5/18",g:[],
p:["<b>Fundamental</b> quantities: length, mass, time. <b>Derived</b>: area, volume, speed, force…","Tools: <b>vernier</b> (small lengths; reading = X + x·0.1 mm), <b>micrometer</b> (paper thickness), digital balance, stopwatch, cesium atomic clock.","Standards: metre &amp; kilogram use platinum–iridium (rigid, chemically inactive, unaffected by temperature). Second = 1/86400 of the mean solar day / cesium clock.","Prefixes: tera 10¹², giga 10⁹, mega 10⁶, kilo 10³, centi 10⁻², milli 10⁻³, micro 10⁻⁶, nano 10⁻⁹, pico 10⁻¹².","Conversions: go through the SI unit; for powers of units raise the factor to the same power. <b>km/h → m/s = ×5/18</b>.","Dimensions [MᵃLᵇTᶜ]: only equal dimensions can be added or subtracted; numbers, π and sin/cos have none. Used to <b>test a formula</b>.","Errors: unsuitable tool, defective tool, wrong procedure, environment → reduce by averaging readings. Direct vs indirect measurement."]},
{n:2,t:"Motion in a straight line",ic:"🏃",tip:"slopes of d–t and v–t graphs, average speed vs average velocity",f:"v = Δd/Δt · a = (v_f − v_i)/Δt · 1 km/h = 5/18 m/s",
g:[['l','t','d','d–t: uniform velocity, slope = v'],['l','t','v','v–t: uniform acceleration, slope = a'],['f','t','v','v–t: constant velocity, a = 0']],
p:["Motion = change of position relative to a fixed object. <b>Translational</b> (start and end) vs <b>periodic</b> (repeats).","<b>Speed</b> = distance/time (scalar, always +). <b>Velocity</b> = displacement/time (vector, ±).","Uniform velocity: equal displacements in equal times → <b>straight d–t line</b>; non-uniform → curve.","Slope of d–t = velocity. Slope of v–t = <b>acceleration</b>. Horizontal d–t line = body at rest.","Average velocity = total displacement ÷ total time. Average speed = total distance ÷ total time.","Acceleration a = Δv/Δt (m/s²): + speeds up, − slows down (deceleration), 0 = uniform velocity.","Velocity can be zero while acceleration is not (e.g. top of a throw)."]},
{n:3,t:"Force and motion",ic:"🚀",tip:"F = ma problems and action–reaction pairs",f:"ΣF = m·a = Δp/Δt · p = m·v · W = m·g",
g:[['l','m','p','p–m: momentum ∝ mass'],['l','F','a','a–F: a ∝ F (m constant)'],['h','m','a','a–m: a ∝ 1/m (F constant)']],
p:["<b>Newton 1 (inertia)</b>: ΣF = 0 ⇒ rest or constant velocity. Seat belts fight inertia.","<b>Newton 3</b>: F₁ = −F₂. Action and reaction act on <b>different bodies</b>, so they never cancel. Rockets, recoil, balloons.","Equilibrium of forces: equal, opposite, same line of action, <b>same body</b>.","<b>Momentum</b> p = m·v (kg·m/s, MLT⁻¹): vector along v; zero at rest.","<b>Newton 2</b>: ΣF = Δp/Δt = m·a. a ∝ F (m const), a ∝ 1/m (F const).","1 newton = force giving 1 kg an acceleration of 1 m/s². With friction: ΣF = F − F_friction.","Mass (kg, scalar) ≠ weight (N, vector, W = m·g, towards Earth's centre)."]},
{n:4,t:"Fluids: density, flow, viscosity",ic:"💧",tip:"the continuity equation and density units",f:"ρ = m/V · Q = A·v · A₁v₁ = A₂v₂ (v ∝ 1/r²)",
g:[['l','Vol','m','m–Vol: slope = density ρ'],['l','1/A','v','v–1/A: line through origin']],
p:["Liquids and gases are <b>fluids</b>. Liquids: definite volume, incompressible. Gases: take the container, compressible.","<b>Density</b> ρ = m/Vol (kg/m³). 1 g/cm³ = 1000 kg/m³. Mixtures: m = m₁+m₂, Vol = Vol₁+Vol₂.","<b>Relative density</b> = ρ material ÷ ρ water: a ratio, so <b>no unit</b>. Uses: battery charge, anaemia, urine tests.","<b>Steady (laminar) flow</b>: streamlines never intersect; dense streamlines = fast flow; no friction; incompressible.","Flow rates: Q_V = A·v (m³/s), Q_m = ρ·A·v (kg/s). Taps filling together: Q = Q₁ + Q₂.","<b>Continuity</b>: A₁v₁ = A₂v₂ → v ∝ 1/A ∝ 1/r² ∝ 1/d². Branches: A₁v₁ = ΣAv.","<b>Turbulent flow</b>: eddies above a speed limit. <b>Viscosity</b>: friction between layers (lubrication, fuel saving, blood-sedimentation test)."]},
{n:5,t:"Pressure and hydrostatics",ic:"🌊",tip:"P = ρgh, U-tube, manometer and hydraulic press",f:"P = F/A · P = ρgh · P_total = Pa + ρgh · F/f = A/a",
g:[['l','h','P','P–h (closed): through origin'],['i','h','P','P–h (open): intercept = Pa'],['l','1/A','P','P–1/A: slope = F']],
p:["<b>Pressure</b> P = F/A (Pa = N/m²); for a slanted force use its perpendicular part. Wide tyres, sharp needles: P ∝ 1/A.","Liquid pressure <b>P = ρgh</b>; open to air P = Pa + ρgh (Pa = 1.013×10⁵ Pa). Same horizontal level ⇒ same pressure.","U-tube with immiscible liquids: <b>ρ₁h₁ = ρ₂h₂</b>; tube radius doesn't matter.","<b>Mercury barometer</b>: 1 atm = 76 cmHg = 760 Torr = 1.013×10⁵ Pa. Falls on a mountain; independent of tube area.","Water can't replace mercury: the tube would need to exceed 10 m.","<b>Manometer</b>: P_gas = Pa ± ρgh (+ when the open arm is higher). Water for small, mercury for large pressures.","<b>Pascal</b>: pressure on an enclosed liquid is transmitted in full. Hydraulic press F/f = A/a = y₁/y₂; efficiency &lt; 100%."]},
{n:6,t:"Heat: gas laws",ic:"🔥",tip:"converting C to K and choosing the right gas law",f:"PV/T = constant · T(K) = t(°C) + 273",
g:[['h','V','P','Boyle: P–V hyperbola'],['l','T (K)','V','Charles: V–T line through origin'],['l','T (K)','P','Jolly: P–T line through origin']],
p:["Gas molecules move randomly (<b>Brownian motion</b>), have large gaps, and are compressible.","<b>Boyle</b> (T const): P₁V₁ = P₂V₂. A bubble grows as it rises (pressure falls).","<b>Charles</b> (P const): V/T = const; α_v = 1/273 K⁻¹. Air must be dry; uniform tube.","<b>Jolly / pressure law</b> (V const): P/T = const; β_p = 1/273 K⁻¹.","<b>General gas law</b>: P₁V₁/T₁ = P₂V₂/T₂. Always use <b>Kelvin</b>.","Absolute zero: volume or pressure of an ideal gas vanishes (theoretically). STP: 1.013×10⁵ Pa and 273 K.","Gas mixtures: (PV/T)mix = P₁V₁/T₁ + P₂V₂/T₂."]}];
/* [chapter 0-5, level 1-3, question, options, correct index, why correct, why the tempting wrong answer fails] */
const QB=[
[0,1,"Which of these is a fundamental physical quantity?",["Velocity","Mass","Volume","Force"],1,"Mass, length and time cannot be defined from other quantities.","Velocity, volume and force are all built from length, mass and time, so they are derived."],
[0,1,"Which tool suits measuring the thickness of a sheet of paper?",["Ruler","Vernier caliper","Micrometer","Stopwatch"],2,"The micrometer measures very small lengths such as paper thickness.","A ruler and a vernier caliper are for larger lengths; a stopwatch measures time."],
[0,2,"The dimensional formula of force is…",["MLT⁻¹","ML²T⁻²","MLT⁻²","ML⁻¹T⁻²"],2,"F = m·a = M × LT⁻² = MLT⁻².","MLT⁻¹ is momentum and ML²T⁻² is work. Multiply mass by acceleration (LT⁻²) to check."],
[0,3,"Pressure P = F/A has dimensional formula…",["ML⁻¹T⁻²","MLT⁻²","ML²T⁻²","ML⁻²T⁻²"],0,"[F] = MLT⁻² and [A] = L², so [P] = MLT⁻²/L² = ML⁻¹T⁻².","Dividing by L² lowers the length power by 2 (1 − 2 = −1)."],
[1,1,"Which statement is correct?",["Speed is a vector; velocity is a scalar","Velocity is a vector and can be negative; speed is a scalar and always positive","Speed and velocity are always equal","Speed has a direction"],1,"Velocity includes direction (vector); speed does not (scalar).","Speed has no direction, so it is the scalar one."],
[1,1,"On a displacement–time graph, a horizontal line means the body is…",["moving with constant velocity","at rest","accelerating","moving backwards"],1,"The slope of d–t is velocity; zero slope means v = 0.","A moving body would give a sloped line."],
[1,2,"A girl runs A→B at 5 m/s and back at 3 m/s. Her average speed for the round trip is…",["4 m/s","3.75 m/s","1.875 m/s","0 m/s"],1,"Equal distances d: v = 2d/(d/5 + d/3) = 2·5·3/(5+3) = 3.75 m/s.","4 m/s is the simple mean, valid only for equal times. 0 would be the average velocity (zero displacement)."],
[1,2,"The slope of a velocity–time graph represents…",["displacement","acceleration","distance","speed"],1,"Slope = Δv/Δt = acceleration.","Displacement is the area/ slope of d–t type information, not the v–t slope."],
[2,1,"A passenger lurches forward when a car brakes suddenly. This is explained by…",["Newton's third law","inertia (Newton's first law)","Newton's second law","weight"],1,"The body tends to keep its state of motion.","No pair of action–reaction forces is responsible for the lurch."],
[2,2,"Action and reaction do NOT cancel each other because…",["they are unequal","they act on different bodies","they act in the same direction","they happen at different times"],1,"Equilibrium needs forces on the same body; action and reaction act on two bodies.","They are equal in size and opposite in direction."],
[2,2,"A 10 kg block is pulled by 50 N while friction is 20 N. Its acceleration is…",["5 m/s²","3 m/s²","7 m/s²","2 m/s²"],1,"ΣF = 50 − 20 = 30 N; a = 30/10 = 3 m/s².","5 m/s² ignores friction; only the resultant force accelerates the block."],
[2,3,"A 2 kg ball hits a wall at 3 m/s and rebounds at 2 m/s. The magnitude of its change in momentum is…",["2 kg·m/s","10 kg·m/s","5 kg·m/s","1 kg·m/s"],1,"Taking the initial direction as +: Δp = 2(−2) − 2(3) = −10, magnitude 10 kg·m/s.","Subtracting speeds ignores that the direction reverses, so the momenta add in size."],
[3,1,"The relative density of a material has…",["unit kg/m³","unit g/cm³","no unit","unit N"],2,"It is a ratio of two similar quantities (ρ material / ρ water).","Density has units; relative density is a pure ratio."],
[3,2,"A tank holds 3450 kg of gasoline in 5 m³. Its density is…",["690 kg/m³","720 kg/m³","17.25 kg/m³","3.455 kg/m³"],0,"ρ = m/Vol = 3450/5 = 690 kg/m³.","Density is mass divided by volume."],
[3,2,"In steady flow, when a tube narrows the liquid speed…",["decreases","increases","stays the same","becomes zero"],1,"A₁v₁ = A₂v₂, so smaller area means larger speed.","Speed is inversely proportional to cross-section area."],
[3,3,"Water flows at 2 m/s in a pipe of radius 3 cm. Its speed where the radius is 1 cm is…",["6 m/s","18 m/s","0.67 m/s","4 m/s"],1,"v₂ = v₁(r₁/r₂)² = 2 × 9 = 18 m/s.","6 m/s forgets the square: area depends on r²."],
[3,2,"Which is NOT a condition of steady flow?",["No friction between layers","Irrotational motion","Speed at a point changes with time","Constant flow rate"],2,"In steady flow the speed at any fixed point stays constant.","The other three are conditions of steady flow."],
[4,1,"Pressure is…",["force × area","the force acting perpendicularly on a unit area","the weight of an object","mass per unit volume"],1,"P = F/A with F perpendicular to the surface.","Force × area has no physical meaning here; mass/volume is density."],
[4,2,"Why can't water replace mercury in a barometer?",["Water is too dense","Its density is much smaller, so the tube would need to exceed 10 m","Water cannot be a liquid","Water has no weight"],1,"Height h ∝ 1/ρ; water needs about 13.6 times mercury's height.","Water is far LESS dense than mercury."],
[4,3,"Small piston 5 cm², big piston 200 cm². A 100 N force on the small piston gives on the big piston…",["2500 N","4000 N","100 N","40 N"],1,"F = f·A/a = 100 × 200/5 = 4000 N.","The force multiplies by A/a, not a/A."],
[4,3,"The mercury level in the open arm of a manometer is 20 cm lower than in the gas arm. With Pa = 76 cmHg the gas pressure is…",["96 cmHg","56 cmHg","76 cmHg","20 cmHg"],1,"The gas arm is higher, so P_gas = Pa − h = 76 − 20 = 56 cmHg.","Add h only when the open arm is HIGHER than the gas arm."],
[5,1,"Boyle's law holds at constant…",["pressure","volume","temperature","density"],2,"Boyle: P·Vol is constant for a fixed mass at constant temperature.","Constant pressure is Charles' law; constant volume is Jolly's."],
[5,2,"300 cm³ of gas at 20 cmHg is compressed to 60 cmHg at constant temperature. Its new volume is…",["100 cm³","900 cm³","200 cm³","60 cm³"],0,"20 × 300 = 60 × V₂ → V₂ = 100 cm³.","900 multiplies instead of using the inverse relation."],
[5,2,"Why must the air in Charles' experiment be completely dry?",["Water vapour pressure changes with temperature and spoils accuracy","Dry air is lighter","Water would freeze","Mercury reacts with water"],0,"Vapour pressure changes with temperature, so the pressure would not stay constant.","The reason is about pressure, not mass or freezing."],
[5,3,"450 cm³ of gas at 273 K is heated to 364 K at constant pressure. Its volume becomes…",["600 cm³","340 cm³","450 cm³","400 cm³"],0,"V₂ = 450 × 364/273 = 600 cm³.","Volume rises with temperature, so the result must exceed 450 cm³."]];
/* generators: unlimited new questions with a specific reason for EVERY wrong option */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),Pk=a=>a[R(0,a.length-1)],F=x=>String(+(+x).toPrecision(5));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
function mk(c,lv,q,right,wr,e,u=''){const o=[[right+u,'']].concat(wr.map(w=>[w[0]+u,w[1]]));if(new Set(o.map(x=>x[0])).size<4)return null;const s=sh(o);return{c,lv,q,o:s.map(x=>x[0]),a:s.findIndex(x=>x[1]===''),e,r:s.map(x=>x[1])}}
const GN=[
[0,1,()=>{const r=R(2,12),k=18*r;return mk(0,1,`A car moves at ${k} km/h. Its velocity in m/s is…`,F(5*r),[[F(k*18/5),"You multiplied by 18/5. The factor from km/h to m/s is 1000/3600 = 5/18."],[F(k/60),"Dividing by 60 only turns hours into minutes. Convert km→m and h→s as well."],[F(k*1000),"×1000 converts km to m, but you forgot to divide by 3600 s per hour."]],`v = ${k}×1000 m ÷ 3600 s = ${k}×5/18 = ${5*r} m/s.`,' m/s')}],
[0,1,()=>{const x=R(2,9);return mk(0,1,`${x} mA expressed in µA equals…`,`${x}×10³`,[[`${x}×10⁶`,"mA→A is ×10⁻³ first, then A→µA is ×10⁶, so the net factor is 10³, not 10⁶."],[`${x}×10⁻³`,"That only converts mA to A. Continue to µA by multiplying by 10⁶."],[`${x}×10⁹`,"Too large: milli (10⁻³) and micro (10⁻⁶) differ by only 10³."]],`${x} mA = ${x}×10⁻³ A = ${x}×10⁻³×10⁶ µA = ${x}×10³ µA.`)}],
[1,3,()=>{const[a,b]=Pk([[10,40],[20,30],[30,60],[40,60],[60,90],[50,75]]),v=2*a*b/(a+b);return mk(1,3,`A body covers the first half of a distance at ${a} m/s and the second half at ${b} m/s. Its average speed is…`,F(v),[[F((a+b)/2),"The simple mean only works for equal TIMES. Here the distances are equal, so the slow leg takes longer."],[F(a+b),"Adding speeds does not give an average."],[F(a*b/(a+b)),"You dropped the factor 2: v = 2v₁v₂/(v₁+v₂)."]],`Each half = d: time = d/${a} + d/${b}; v = 2d ÷ time = 2×${a}×${b}/(${a}+${b}) = ${F(v)} m/s.`,' m/s')}],
[1,1,()=>{const vi=R(1,10),t=R(2,8),a=R(2,6),vf=vi+a*t;return mk(1,1,`A car's velocity rises from ${vi} m/s to ${vf} m/s in ${t} s. Its acceleration is…`,F(a),[[F((vf+vi)/t),"Acceleration uses the CHANGE in velocity (v_f − v_i), not the sum."],[F((vf-vi)*t),"You multiplied by time; acceleration is change in velocity divided by time."],[F(vf/t),"You used v_f only. Subtract the initial velocity first."]],`a = (${vf} − ${vi})/${t} = ${a} m/s².`,' m/s²')}],
[2,1,()=>{const m=R(2,20),a=R(2,9);return mk(2,1,`The resultant force on a ${m} kg body that accelerates at ${a} m/s² is…`,F(m*a),[[F(m+a),"Mass and acceleration are multiplied, not added."],[F(m/a),"F = m·a, not m/a."],[F(a/m),"a/m is not a force; use F = m·a."]],`ΣF = m·a = ${m}×${a} = ${m*a} N.`,' N')}],

<label>Question source</label><select id="sr"><option value="0">Syllabus-style + newly generated</option><option value="1">Syllabus-style only</option><option value="2">Newly generated only (endless)</option><option value="3">Essay questions (write your answer)</option></select>
<p id="msg" class="no"></p><button class="btn" onclick="go()">Start</button></section>`}
function go(){const sel=[...document.querySelectorAll('.cs:checked')].map(x=>+x.value);if(!sel.length){$('#msg').textContent='Pick at least one chapter.';return}S.sel=sel;const n=Math.min(60,Math.max(3,+$('#nn').value||10)),sr=+$('#sr').value;if(sr==3){S.q={qs:sh(ES.filter(e=>sel.includes(e[0]))).slice(0,n).map(e=>({es:1,c:e[0],q:e[1],m:e[2],k:e[3].split(',')})),i:0,res:[],exam:0};nq();return}S.q={qs:build(sel,+$('#lv').value,n,sr),i:0,res:[],exam:0};nq()}
function nq(){const Q=S.q,q=Q.qs[Q.i];clearInterval(S.tk);Q.tq=Date.now();Q.d=0;$('#app').innerHTML=`<section class="card"><div class="top"><b>${Q.exam?'Exam':'Practice'} · ${Q.i+1}/${Q.qs.length}</b><span id="tm" class="m"></span></div><div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div><p class="m">${CH[q.c].ic} ${CH[q.c].t}</p><h3>${q.q}</h3>${q.es?ESUI:''}<div>${(q.o||[]).map((o,j)=>`<button class="op" onclick="pk(${j})"><b>${'ABCD'[j]}</b> ${o}</button>`).join('')}</div><div id="fb"></div></section>`;S.tk=setInterval(tick,1000);tick()}
function tick(){const Q=S.q;if(!Q||!$('#tm'))return;if(Q.exam){const r=Math.max(0,Math.round((Q.end-Date.now())/1000));$('#tm').textContent='⏱ '+Math.floor(r/60)+':'+String(r%60).padStart(2,'0')+' left';if(!r)fin()}else if(!Q.d)$('#tm').textContent='⏱ '+Math.round((Date.now()-Q.tq)/1000)+' s'}
const fbk=(q,j,ok)=>ok?`<div class="fb ok"><b>✓ Correct.</b> ${q.e}</div>`:`<div class="fb no"><b>✗ Not correct — why your answer fails:</b> ${q.r?q.r[j]:q.x}</div><div class="fb ok"><b>Correct answer: ${'ABCD'[q.a]}) ${q.o[q.a]}.</b> Why: ${q.e}</div>`;
function pk(j){const Q=S.q,q=Q.qs[Q.i];if(Q.d)return;Q.d=1;const t=Math.round((Date.now()-Q.tq)/1000),ok=j==q.a;S.log.push({c:q.c,ok,t,m:Q.exam?'e':'p'});Q.res.push({q,j,ok,t});sv();
document.querySelectorAll('.op').forEach((b,k)=>{b.disabled=true;if(Q.exam){if(k==j)b.classList.add('sel')}else if(k==q.a)b.classList.add('ok');else if(k==j)b.classList.add('no')});
$('#fb').innerHTML=(Q.exam?'':fbk(q,j,ok))+`<button class="btn" onclick="nx()">${Q.i+1<Q.qs.length?'Next →':'Finish'}</button>`}
function nx(){const Q=S.q;Q.i++;Q.i<Q.qs.length?nq():fin()}
function fin(){const Q=S.q;if(!Q)return;clearInterval(S.tk);const n=Q.qs.length,k=Q.res.filter(r=>r.ok).length,tt=Q.res.reduce((a,r)=>a+r.t,0),bad=Q.res.filter(r=>!r.ok);if(Q.exam){S.ex.push({k,n,p:Math.round(100*k/n)});sv()}
$('#app').innerHTML=`<section class="card"><h2>${Q.exam?'Exam finished':'Session finished'}</h2><div class="score">${k}/${n}<small>${Math.round(100*k/n)}% · ${Math.round(tt/6)/10} min · ${Math.round(tt/Math.max(1,Q.res.length))} s per question</small></div><button class="btn" onclick="tab('rp')">See my report →</button><button class="btn alt" onclick="tab('${Q.exam?'ex':'pr'}')">${Q.exam?'New exam':'Practice again'}</button>${Q.exam&&bad.length?`<h3>Review your mistakes</h3>${bad.map(r=>`<div class="rvw"><p><b>${r.q.q}</b></p>${fbk(r.q,r.j,false)}</div>`).join('')}`:''}</section>`;S.q=null}
/* 3 report */
function stats(){const L=S.log,by=CH.map((_,i)=>{const a=L.filter(l=>l.c==i),k=a.filter(l=>l.ok).length;return{n:a.length,k,p:a.length?Math.round(100*k/a.length):null,t:a.length?Math.round(a.reduce((s,l)=>s+l.t,0)/a.length):0}}),n=L.length,k=L.filter(l=>l.ok).length;return{by,n,k,p:n?Math.round(100*k/n):0,t:n?Math.round(L.reduce((s,l)=>s+l.t,0)/n):0}}
const lvl=p=>p>=85?['Excellent','You have mastered most of the syllabus.']:p>=70?['Good','Solid understanding; polish the weaker chapters.']:p>=50?['Developing','You know the basics but lose marks on applications and units.']:['Needs foundation','Go back to the summaries and rebuild each chapter step by step.'];
function repData(){const s=stats();if(s.n<5)return null;const[lv,ds]=lvl(s.p),pace=s.t<25&&s.p<70?'very fast but inaccurate - slow down and check units and signs':s.t>90?'slow - memorise the key formulas and practise timed sets':'good pace (aim for 45-75 s per question)';
const L=['PHYSICS STUDY REPORT','Date: '+new Date().toLocaleDateString('en-GB'),'',`Overall level: ${lv} - ${s.p}% (${s.k}/${s.n} correct)`,ds,`Average time per question: ${s.t} s - ${pace}.`,'','Chapter breakdown'],wk=[];
s.by.forEach((b,i)=>{const nm=`Ch ${i+1} ${CH[i].t}`;if(b.p==null)L.push(`- ${nm}: not attempted yet`);else{L.push(`- ${nm}: ${b.p}% (${b.k}/${b.n}), ${b.t} s avg - ${b.p>=80?'Strong':b.p>=55?'Review':'Weak'}`);if(b.p<80)wk.push([b.p,i])}});
L.push('','What to do next');wk.sort((a,b)=>a[0]-b[0]);if(!wk.length)L.push('- Keep revising weekly and take a full exam every 2 weeks.');
wk.forEach(([p,i],k)=>L.push(`${k+1}. Chapter ${i+1}: re-read the summary (15 min), then solve 10 ${p<55?'easy':'medium'} questions. Focus on ${CH[i].tip}.`));
const un=s.by.map((b,i)=>b.p==null?i+1:0).filter(Boolean);if(un.length)L.push('- Practise the chapters not attempted yet: '+un.join(', ')+'.');if(S.ex.length)L.push('','Exam history: '+S.ex.map(e=>e.p+'%').join(', '));return{lines:L,lv,s}}
function vRep(){const r=repData();$('#app').innerHTML=!r?`<section class="card"><h2>My report</h2><p>Solve at least 5 questions (or take the exam) and your level, speed and study plan will appear here.</p></section>`:`<section class="card"><h2>My report</h2><div class="score">${r.lv}<small>${r.s.p}% · ${r.s.k}/${r.s.n} correct · ${r.s.t} s average</small></div>${r.s.by.map((b,i)=>`<div class="br"><span>Ch ${i+1} ${CH[i].t}</span><div class="bar"><i style="width:${b.p||0}%;background:${b.p>=80?'var(--ok)':b.p>=55?'var(--a)':'var(--no)'}"></i></div><b>${b.p==null?'–':b.p+'%'}</b></div>`).join('')}<div class="rl">${r.lines.slice(3).map(l=>l?`<p>${l}</p>`:'<br>').join('')}</div><button class="btn" onclick="dl()">⬇ Download my PDF report</button><button class="btn alt" onclick="rs()">Reset progress</button></section>`}
function rs(){S.log=[];S.ex=[];sv();vRep()}
const wrap=L=>L.flatMap(l=>{const o=[];while(l.length>88){let k=l.lastIndexOf(' ',88);if(k<1)k=88;o.push(l.slice(0,k));l='   '+l.slice(k).trim()}o.push(l);return o});
function mkPdf(L){const esc=t=>t.replace(/[^\x20-\x7e]/g,'?').replace(/[\\()]/g,'\\$&'),pg=[],ob=[];for(let i=0;i<L.length;i+=46)pg.push(L.slice(i,i+46));ob[1]='<</Type/Catalog/Pages 2 0 R>>';ob[3]='<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>';const kids=[];
pg.forEach((p,i)=>{const pn=4+i*2,cn=5+i*2,st='BT /F1 11 Tf 14 TL 50 750 Td '+p.map(l=>'('+esc(l)+') Tj T*').join(' ')+' ET';kids.push(pn+' 0 R');ob[pn]=`<</Type/Page/Parent 2 0 R/MediaBox[0 0 612 792]/Resources<</Font<</F1 3 0 R>>>>/Contents ${cn} 0 R>>`;ob[cn]=`<</Length ${st.length}>>stream\n${st}\nendstream`});
ob[2]=`<</Type/Pages/Kids[${kids.join(' ')}]/Count ${pg.length}>>`;let s='%PDF-1.4\n';const off=[];for(let i=1;i<ob.length;i++){off[i]=s.length;s+=`${i} 0 obj\n${ob[i]}\nendobj\n`}const x=s.length;s+=`xref\n0 ${ob.length}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${ob.length}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;return new Blob([s],{type:'application/pdf'})}
async function dl(){const r=repData();if(!r)return;let d=null;try{d=window.claude?await claude.use('downloads'):null}catch(e){}if(!d){window.print();return}try{await d.save({filename:'physics-report.pdf',data:mkPdf(wrap(r.lines))})}catch(e){}}
/* 4 exam */
function vEx(){$('#app').innerHTML=`<section class="card"><h2>Full exam</h2><p>24 questions across all six chapters (4 each), mixed difficulty, <b>40 minutes</b>. No feedback until the end — then every mistake is explained and your report is updated.</p>${S.ex.length?`<p class="m">Previous exam scores: ${S.ex.map(e=>e.p+'%').join(', ')}</p>`:''}<button class="btn" onclick="goE()">Start exam</button></section>`}
function goE(){S.q={qs:build([0,1,2,3,4,5],0,24,0),i:0,res:[],exam:1,end:Date.now()+2400000};nq()}
tab('rv');
</script></body></html>
